[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

# ==========================================================
# Project metadata
# ==========================================================

[project]
name = "cosmofit"
version = "0.37.3"

description = "A modular Python library for cosmological parameter estimation."

readme = "README.md"

requires-python = ">=3.11"

license = { text = "MIT" }

authors = [
    { name = "Salih Yeşil" }
]

keywords = [
    "cosmology",
    "astronomy",
    "dark-energy",
    "bao",
    "supernova",
    "cc",
    "cmb",
    "planck",
    "camb",
    "boltzmann",
    "power-spectrum",
    "cmb-lensing",
    "reionization",
    "act",
    "wcdm",
    "cpl",
    "lcdm",
    "jbp",
    "chaplygin-gas",
    "des-sn5yr",
    "union3",
    "sdss",
    "eboss",
    "boss",
    "6dfgs",
    "bbn",
    "sh0es",
    "pede",
    "dgp",
    "cardassian",
    "running-vacuum",
    "interacting-dark-energy",
    "sound-horizon",
    "drag-epoch",
    "neutrinos",
    "likelihood",
    "mcmc",
    "hdf5",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "emcee>=3.1",
    "h5py>=3.10",
    "corner>=2.2",
    "tqdm>=4.66",
    "threadpoolctl>=3.0",
]

# ==========================================================
# Optional dependencies
# ==========================================================

[project.optional-dependencies]

dev = [
    "pytest",
    "black",
    "ruff",
    "ipykernel",
    "jupyterlab",
]

speed = [
    "numba>=0.60",
]

evidence = [
    "dynesty>=2.1",
]

# Symbolic derivation of a Friedmann equation from an action
# (CosmoFit.theory). Nothing else in the library needs it.
theory = [
    "sympy>=1.12",
]

# Boltzmann-code backend, needed only by the "planck_lite" dataset
# (the from-scratch CMB power spectrum). Everything else in the
# library -- including the compressed Planck distance priors --
# works without it.
cmb = [
    "camb>=1.5",
]

gui = [
    "streamlit>=1.38",
]

docs = [
    "sphinx",
    "furo",
]

# ==========================================================
# Package discovery
# ==========================================================
#
# src layout: the importable package lives at src/CosmoFit, so
# end users do `from CosmoFit import ...` regardless of the PyPI
# distribution name ("cosmofit") above.

[tool.setuptools.packages.find]

where = ["src"]

[tool.setuptools.package-data]

# Bundled observational datasets (CC, DESI DR1/DR2 BAO, SDSS BAO,
# 6dFGS/MGS, Pantheon+, DES-SN5YR, Union3, Planck distance priors,
# Planck plik_lite bandpowers, growth/S8, and the external H0/BBN/tau
# priors) living under CosmoFit/data/ -- not .py files, so setuptools
# won't pick them up automatically.
CosmoFit = [
    "data/**/*.txt",
    "data/**/*.dat",
    "data/**/*.cov",
    "data/**/*.csv",
    "data/**/*.npz",
]